name: Deploy

# Déclenché par un tag de version (release), ou manuellement (pour tester)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push de l'image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer les tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robinlrn/cesizen-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
